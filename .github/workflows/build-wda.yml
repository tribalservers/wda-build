name: Build unsigned WebDriverAgent.ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Clone WebDriverAgent
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git wda

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build WebDriverAgentRunner (unsigned)
        working-directory: wda
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Ad-hoc sign every binary (so sideloading tools can re-sign cleanly)
        working-directory: wda
        run: |
          APP_PATH="build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          find "$APP_PATH" -type f \( -perm -111 -o -name "*.dylib" \) -exec file {} \; \
            | grep -i "mach-o" | cut -d: -f1 | while read -r bin; do
              echo "Signing: $bin"
              codesign --force --sign - --timestamp=none "$bin"
            done
          codesign --force --sign - --timestamp=none "$APP_PATH"
          codesign -dv "$APP_PATH/PlugIns/WebDriverAgentRunner.xctest/WebDriverAgentRunner" 2>&1 || true

      - name: Package as .ipa
        working-directory: wda
        run: |
          APP_PATH="build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WebDriverAgentRunner.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-unsigned
          path: wda/WebDriverAgentRunner.ipa
